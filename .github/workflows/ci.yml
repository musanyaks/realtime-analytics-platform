name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      # Dummy Snowflake credentials so env-var presence checks pass.
      # Actual connection tests are skipped when these are dummy values.
      SNOWFLAKE_ACCOUNT: "dummy_account"
      SNOWFLAKE_USER: "dummy_user"
      SNOWFLAKE_PASSWORD: "dummy_password"
      SNOWFLAKE_DATABASE: "dummy_db"
      SNOWFLAKE_SCHEMA: "dummy_schema"
      SNOWFLAKE_WAREHOUSE: "dummy_wh"

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install dependencies
        run: |
          Rscript -e "install.packages(c('rmarkdown', 'knitr', 'testthat', 'lintr', 'dplyr', 'ggplot2', 'DBI', 'odbc', 'plotly', 'DT', 'sparklyr', 'dbplyr', 'kafka'))"

      - name: Lint R code
        run: Rscript -e "lintr::lint_dir('r_analytics')"

      - name: Run tests
        run: Rscript tests/test_pipeline.R

      - name: Verify report can render (dry run)
        run: |
          mkdir -p output
          Rscript -e "rmarkdown::render('r_analytics/reports/daily_report.Rmd', \
            output_file='../../output/daily_report_test.html', \
            params=list(run_date=Sys.Date()))"

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config check
        run: docker compose config

      - name: Build images
        run: docker compose build
