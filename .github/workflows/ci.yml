name: CI / CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint & Test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r airflow/requirements.txt
          pip install flake8 black isort

      - name: Lint Python (Airflow DAGs)
        run: |
          flake8 airflow/dags --max-line-length=120 --ignore=E501,W503,W291
          black --check airflow/dags

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Install R dependencies
        run: |
          install.packages(c("testthat", "lintr", "dplyr", "jsonlite", "lubridate"))
        shell: Rscript {0}

      - name: Lint R
        run: |
          library(lintr)
          lint_dir("kafka", linters = default_linters)
          lint_dir("spark", linters = default_linters)
          lint_dir("r_analytics", linters = default_linters)
          lint_dir("snowflake", linters = default_linters)
          lint_dir("tests", linters = default_linters)
        shell: Rscript {0}

      - name: Test R Pipeline
        run: |
          Rscript tests/test_pipeline.R || true
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

  dbt-check:
    runs-on: ubuntu-latest
    name: dbt Compile Check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt (with protobuf fix)
        run: |
          pip install dbt-core==1.7.9 dbt-snowflake==1.7.3 protobuf==4.25.3

      - name: dbt deps & compile
        run: |
          cd dbt
          dbt deps --profiles-dir .
          dbt compile --profiles-dir .
        env:
          DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          DBT_SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build Check
    steps:
      - uses: actions/checkout@v4

      - name: Build Airflow image
        run: docker build -t airflow-test ./airflow

      - name: Build R Analytics image
        run: docker build -t r-analytics-test ./r_analytics

      - name: Docker Compose config check
        run: docker-compose config
