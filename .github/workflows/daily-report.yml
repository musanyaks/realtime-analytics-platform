name: Daily Report Generation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libicu-dev libxml2-dev libcurl4-openssl-dev libssl-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev \
            unixodbc unixodbc-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: report-ubuntu-24.04-r-4.3.0-v2-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }}
          restore-keys: report-ubuntu-24.04-r-4.3.0-v2-

      - name: Install R packages
        run: |
          Rscript -e "pkgs <- c('rmarkdown', 'knitr', 'dplyr', 'ggplot2', 'DBI', 'odbc', 'plotly', 'DT', 'sparklyr', 'dbplyr', 'kableExtra'); install.packages(setdiff(pkgs, rownames(installed.packages())), Ncpus = 2); stopifnot(all(pkgs %in% rownames(installed.packages())))"

      - name: Create output directory
        run: mkdir -p output

      - name: Render Report
        run: |
          Rscript -e "rmarkdown::render('r_analytics/reports/daily_report.Rmd', \
            output_file='../../output/daily_report.html', \
            params=list(run_date=Sys.Date()))"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: output/daily_report.html
          retention-days: 30

      - name: Commit report to repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f output/daily_report.html
          git diff --staged --quiet || git commit -m "Add daily report for $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
