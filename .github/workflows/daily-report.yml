name: Daily Report Generation

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC — adjust as needed
  workflow_dispatch:        # Allows manual trigger

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('rmarkdown', 'knitr', 'dplyr', 'ggplot2', 'DBI', 'odbc', 'plotly', 'DT'))"

      - name: Create output directory
        run: mkdir -p output

      - name: Render Report
        run: |
          Rscript -e "rmarkdown::render('r_analytics/reports/daily_report.Rmd', \
            output_file='../../output/daily_report.html', \
            params=list(run_date=Sys.Date()))"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: output/daily_report.html
          retention-days: 30

      - name: Commit report to repository (optional)
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/daily_report.html
          git diff --staged --quiet || git commit -m "Add daily report for $(date +%Y-%m-%d)"
          git push
