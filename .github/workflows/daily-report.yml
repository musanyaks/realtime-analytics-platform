name: Daily Report Generation

on:
  schedule:
    - cron: '0 6 * * *'  # or whatever trigger you have
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        # This installs the latest pandoc — exactly what rmarkdown needs

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('rmarkdown', 'knitr', 'dplyr', 'plotly', 'DT'))"
          # Add any other packages your report requires

      - name: Render Report
        run: |
          Rscript -e "rmarkdown::render('r_analytics/reports/daily_report.Rmd', output_file='../../output/daily_report.html', params=list(run_date=Sys.Date()))"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: output/daily_report.html