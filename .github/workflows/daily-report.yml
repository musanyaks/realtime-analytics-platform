name: Daily Report Generation

on:
  schedule:
    - cron: "0 6 * * *"  # 6 AM UTC daily
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    name: Generate Daily Analytics Report
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Install R packages
        run: |
          install.packages(c("rmarkdown", "knitr", "kableExtra", "DBI", "odbc", "dplyr", "ggplot2", "scales"))
        shell: Rscript {0}

      - name: Render Report
        run: |
          Rscript -e "rmarkdown::render('r_analytics/reports/daily_report.Rmd', output_file='../../output/daily_report.html', params=list(run_date=Sys.Date()))"
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: output/daily_report.html
