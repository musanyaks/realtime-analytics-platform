name: Docker Build Check

on:
  push:
    branches: [main, master]
    paths:
      - 'docker-compose.yml'
      - '**/Dockerfile'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '**/Dockerfile'
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: "dummy_account"
      SNOWFLAKE_USER: "dummy_user"
      SNOWFLAKE_PASSWORD: "dummy_password"
      SNOWFLAKE_DATABASE: "dummy_db"
      SNOWFLAKE_SCHEMA: "dummy_schema"
      SNOWFLAKE_WAREHOUSE: "dummy_wh"
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install lintr
        run: Rscript -e "install.packages('lintr')"

      - name: Lint R code
        run: Rscript -e "lintr::lint_dir('r_analytics')"

      # FIX: Run from tests/ directory so ../snowflake resolves correctly
      - name: Run R tests
        working-directory: ./tests
        run: Rscript test_pipeline.R

  dbt-compile:
    name: dbt Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Compile dbt models
        working-directory: ./dbt
        run: dbt compile
        env:
          DBT_PROFILES_DIR: .

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config check
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Test containers start
        run: |
          docker compose up -d
          sleep 30
          docker compose ps
          docker compose down
