name: 'realtime_analytics'
version: '1.0.0'
config-version: 2

profile: 'realtime_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  realtime_analytics:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging", "hourly"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts", "daily"]
      core:
        +tags: ["core"]
      aggregates:
        +tags: ["aggregates"]

vars:
  run_date: "2024-01-01"
  lookback_days: 30

on-run-start:
  - "{{ log('Starting dbt run for realtime analytics', info=True) }}"

on-run-end:
  - "{{ log('Completed dbt run for realtime analytics', info=True) }}"
